version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node tracks the node24 runtime declared in action.yml.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint pins a TypeScript peer range; take TypeScript majors manually.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
