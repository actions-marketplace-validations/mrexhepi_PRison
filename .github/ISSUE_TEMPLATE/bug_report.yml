name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens or private code. For security issues use private
        vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Action version or SHA
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow step (redacted)
      render: yaml
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      render: text
